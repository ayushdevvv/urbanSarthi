# UrbanSaarthi API — preserve the existing native Python Render service.
# This Blueprint targets the existing service by name; it does not create a second API.
services:
  - type: web
    name: urbansarthi
    runtime: python
    rootDir: ./backend
    buildCommand: pip install -r requirements.txt
    startCommand: "alembic upgrade heads && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://urbansarthi.vercel.app
      - key: INGESTION_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: MODEL_PATH
        sync: false
      - key: TRAFFIC_MODEL_PATH
        sync: false
