# UrbanSaarthi hackathon deployment: existing API service, now Docker-based
# so SUMO is installed inside the Render container.
services:
  - type: web
    name: urbansaarthi-api
    runtime: docker
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile.sumo
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: INGESTION_API_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: MODEL_PATH
        sync: false
      - key: TRAFFIC_MODEL_PATH
        sync: false
      - key: SUMO_BINARY
        value: /usr/bin/sumo
      - key: SUMO_HOME
        value: /usr/share/sumo
