# UrbanSaarthi production API. The name matches the existing
# https://urbansarthi.onrender.com service so Blueprint sync updates that resource.
# Do not create a second API service or use render-sumo.yaml.
services:
  - type: web
    name: urbansarthi
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.sumo
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://urbansarthi.vercel.app
      - key: INGESTION_API_KEY
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAQ_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: OSRM_BASE_URL
        sync: false
      - key: MODEL_PATH
        sync: false
      - key: TRAFFIC_MODEL_PATH
        sync: false
      - key: SUMO_BINARY
        value: /usr/bin/sumo
      - key: SUMO_HOME
        value: /usr/share/sumo
